<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mom's Trip</title>
<meta name="description" content="Weather for the trip home: Port Canaveral, the drive to Orlando, and the flight to Detroit.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mom's Trip">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="manifest" href="manifest.json">
<meta property="og:type" content="website">
<meta property="og:title" content="Mom's Trip: weather for the trip home">
<meta property="og:description" content="Port Canaveral → Orlando → Detroit, Fri Nov 20. One tap to see if everything looks good.">
<meta property="og:image" content="https://staledonut30.github.io/moms-trip/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<style>
:root{
  --bg:#f7f5f0;--card:#fff;--text:#1a1a1a;--muted:#4f4f4f;--line:#dcd8cf;--link:#0b4f9c;--btn:#0b4f9c;--btn-text:#fff;
  --g-bg:#e2f3e5;--g-bd:#1e7b34;--g-tx:#0d4a1e;
  --y-bg:#fff3c4;--y-bd:#a87d00;--y-tx:#4d3a00;
  --r-bg:#fde2de;--r-bd:#c62828;--r-tx:#741010;
  --u-bg:#ebe9e4;--u-bd:#6b6b6b;--u-tx:#2e2e2e;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121212;--card:#1e1e20;--text:#f3f3f3;--muted:#c4c4c4;--line:#3a3a3d;--link:#8cc4ff;--btn:#2f7de1;--btn-text:#fff;
  --g-bg:#11301a;--g-bd:#4cc26a;--g-tx:#c2f2cf;
  --y-bg:#352a04;--y-bd:#f0c419;--y-tx:#ffeaa3;
  --r-bg:#3f1411;--r-bd:#ff6b5e;--r-tx:#ffd0ca;
  --u-bg:#2a2a2c;--u-bd:#9a9a9a;--u-tx:#e6e6e6;
}}
html{font-size:100%;-webkit-text-size-adjust:100%}
/* iPhone: follow the iOS Text Size setting (rem scales with it). */
@supports (font: -apple-system-body) and (-webkit-touch-callout: none){html{font:-apple-system-body}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;font-size:1.125rem;line-height:1.45;
  padding:max(1rem,env(safe-area-inset-top)) max(1rem,env(safe-area-inset-right)) max(1.5rem,env(safe-area-inset-bottom)) max(1rem,env(safe-area-inset-left));
  overflow-wrap:break-word}
main{max-width:36rem;margin:0 auto}
h1{font-size:1rem;font-weight:600;color:var(--muted);margin:.25rem 0 .75rem;letter-spacing:.02em}
.green{--bgc:var(--g-bg);--bd:var(--g-bd);--tx:var(--g-tx)}
.yellow{--bgc:var(--y-bg);--bd:var(--y-bd);--tx:var(--y-tx)}
.red{--bgc:var(--r-bg);--bd:var(--r-bd);--tx:var(--r-tx)}
.unknown,.done,.home{--bgc:var(--u-bg);--bd:var(--u-bd);--tx:var(--u-tx)}
.home{--bgc:var(--g-bg);--bd:var(--g-bd);--tx:var(--g-tx)}
#overall{background:var(--bgc);border:3px solid var(--bd);color:var(--tx);border-radius:1.1rem;padding:1.1rem 1.1rem 1.2rem}
#overall .big{font-size:1.75rem;font-weight:800;line-height:1.2;margin:0 0 .5rem;display:flex;gap:.5rem;align-items:flex-start}
#overall .big span:first-child{flex:none}
#overall p{margin:0;font-size:1.15rem}
#overall.faded{opacity:.7;border-style:dashed}
#overall .asof{font-size:1rem;font-weight:700;margin:0 0 .4rem}
.checked{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem .75rem;margin:.9rem 0 1.25rem}
#checked{font-size:1.2rem;font-weight:700;margin:0}
#checked.stale{background:var(--u-bg);border:2px solid var(--u-bd);border-radius:.7rem;padding:.6rem .8rem;width:100%}
button,.btn{font:inherit;min-height:2.9rem;border-radius:.8rem;cursor:pointer}
#again{background:var(--card);color:var(--link);border:2px solid var(--line);padding:.4rem 1rem;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-left:.55rem solid var(--bd);border-radius:1rem;padding:.9rem 1rem 1rem;margin:0 0 1rem}
.card.faded{opacity:.6}
.card h2{font-size:1.2rem;margin:0;line-height:1.25}
.when{color:var(--muted);font-size:1rem;margin:.1rem 0 .5rem}
.badge{display:inline-block;background:var(--bgc);color:var(--tx);border:2px solid var(--bd);border-radius:2rem;padding:.15rem .7rem;font-weight:700;margin:0 0 .5rem}
.headline{margin:0 0 .5rem}
.wx{list-style:none;padding:0;margin:.4rem 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:.25rem .75rem;color:var(--muted)}
.more{margin:.5rem 0 0;padding-left:1.2rem}
.more li{margin:.25rem 0}
.tip{margin:.5rem 0 0;font-weight:600}
.note{margin:.4rem 0 0;color:var(--muted);font-size:1rem}
.links{display:grid;gap:.7rem;margin:1.5rem 0}
.btn{display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;background:var(--btn);color:var(--btn-text);font-weight:700;padding:.75rem 1rem}
.btn.alt{background:var(--card);color:var(--link);border:2px solid var(--line)}
footer{color:var(--muted);font-size:1rem;text-align:center;margin:1rem 0 0}
main.checking #overall,main.checking #sections{opacity:.55}
#demo{background:#6b2fbf;color:#fff;border-radius:.6rem;padding:.4rem .7rem;font-weight:700;margin:0 0 .75rem;display:none}
</style>
</head>
<body>
<main>
  <p id="demo"></p>
  <h1>Mom's trip home · Fri Nov 20</h1>
  <section id="overall" class="unknown" aria-live="polite">
    <p class="big"><span>⏳</span><span>Checking the weather…</span></p>
    <p>One moment.</p>
  </section>
  <div class="checked">
    <p id="checked">Checking now…</p>
    <button id="again" type="button">Check again</button>
  </div>
  <div id="sections"></div>
  <nav class="links" aria-label="Helpful links">
    <a class="btn" id="delta-status" href="https://www.delta.com/us/en/flight-status/overview">✈️ Delta flight status (DL2218)</a>
    <a class="btn" href="tel:+18002211212">📞 Call Delta: 1-800-221-1212</a>
    <a class="btn alt" href="https://www.delta.com/us/en/advisories">Delta travel advisories</a>
    <a class="btn alt" href="https://nasstatus.faa.gov/">FAA airport delays (Orlando &amp; Detroit)</a>
  </nav>
  <footer>Weather from the National Weather Service and FAA. Delta makes the final call on flights.</footer>
</main>
<script type="module">
import { checkTrip, formatTime, CONFIG, LABELS } from './status.js';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const demo = new URLSearchParams(location.search).get('demo');
const KEY = 'momtrip:last';
const BADGE = { green: '🟢 Looking good', yellow: '🟡 Keep an eye on', red: '🔴 Action needed', unknown: '⚪ Couldn\'t check', done: '✔️ Done' };

$('delta-status').textContent = `✈️ Delta flight status (${CONFIG.flight.number})`;
if (demo) { $('demo').style.display = 'block'; $('demo').textContent = `Demo mode: "${demo}" (fake data)`; }

function save(r) { if (demo) return; try { localStorage.setItem(KEY, JSON.stringify(r)); } catch {} }
function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } }

function overallHTML(emoji, label, sentence) {
  return `<p class="big"><span>${esc(emoji)}</span><span>${esc(label)}</span></p><p>${esc(sentence)}</p>`;
}

function sectionHTML(s, faded) {
  const w = s.weather;
  const wx = [];
  if (w && s.status !== 'done') {
    wx.push(`🌡️ ${w.tempLo === w.tempHi ? w.tempHi : `${w.tempLo}–${w.tempHi}`}°F`);
    if (w.snowPct >= 20) wx.push(`❄️ Snow ${w.snowPct}%`);
    else wx.push(`☔ Rain ${w.precipPct}%${w.thunderPct >= 20 ? ' (storms)' : ''}`);
    wx.push(`💨 Wind ${w.windMph} mph${w.gustMph >= 20 ? `, gusts ${w.gustMph}` : ''}`);
    wx.push(`☁️ ${w.sky}`);
  }
  const extra = s.reasons.filter(r => r.text !== s.headline);
  const info = s.alerts.filter(a => a.level === 'info');
  return `<section class="card ${s.status}${faded ? ' faded' : ''}">
    <h2>${esc(s.title)}</h2>
    <p class="when">${esc(s.when)}</p>
    <p class="badge">${BADGE[s.status]}</p>
    <p class="headline">${esc(s.headline)}</p>
    ${wx.length ? `<ul class="wx">${wx.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
    ${extra.length ? `<ul class="more">${extra.map(r => `<li>${r.level === 'red' ? '🔴' : '🟡'} ${esc(r.text)}</li>`).join('')}</ul>` : ''}
    ${s.tips.map(t => `<p class="tip">🧥 ${esc(t)}</p>`).join('')}
    ${info.map(a => `<p class="note">ℹ️ ${esc(a.headline || a.event)}</p>`).join('')}
    ${s.status !== 'done' ? s.notes.map(n => `<p class="note">${esc(n)}</p>`).join('') : ''}
  </section>`;
}

function render(r, { stale = false, now = Date.now() } = {}) {
  const ov = $('overall'), ck = $('checked'), secs = $('sections');
  ck.classList.toggle('stale', stale);
  if (!r) {
    ov.className = 'unknown';
    ov.innerHTML = overallHTML('⚪', 'Couldn\'t check right now', 'The internet may be slow. Tap "Check again" in a minute. For your flight, use the Delta app or the buttons below.');
    ck.textContent = 'Couldn\'t check just now.';
    secs.innerHTML = '';
    return;
  }
  const at = formatTime(r.checkedAt);
  const tooOld = stale && now - r.checkedAt > CONFIG.thresholds.staleAfterMinutes * 60e3;
  ck.textContent = stale ? `Couldn't check just now, showing info from ${at}` : `Last checked ${at}`;
  if (tooOld) {
    ov.className = 'unknown';
    ov.innerHTML = overallHTML('⚪', 'Couldn\'t check right now', `The last good check was at ${at}, which is too old to rely on. Tap "Check again" in a minute, or use the Delta app for your flight.`);
  } else {
    ov.className = r.status + (stale ? ' faded' : '');
    ov.innerHTML = (stale ? `<p class="asof">When we last checked at ${esc(at)}:</p>` : '') + overallHTML(r.emoji, r.label, r.sentence);
  }
  if (r.home) { secs.innerHTML = ''; return; }
  secs.innerHTML = r.sections.map(s => sectionHTML(s, stale)).join('');
}

let busy = false, lastRun = 0;
async function run() {
  if (busy || Date.now() - lastRun < 5000) return;
  busy = true; lastRun = Date.now();
  const ck = $('checked');
  ck.classList.remove('stale');
  ck.textContent = 'Checking now…';
  document.querySelector('main').classList.add('checking');
  $('again').disabled = true;
  try {
    let r;
    if (demo) { const d = await import('./demo.js'); r = d.demoResult(demo); }
    else r = await checkTrip();
    save(r);
    render(r, { now: r.checkedAt });
  } catch (e) {
    console.warn(e);
    if (demo) render(e.cached, { stale: true, now: e.now });
    else render(load(), { stale: true });
  } finally {
    busy = false; $('again').disabled = false;
    document.querySelector('main').classList.remove('checking');
  }
}

$('again').addEventListener('click', () => { lastRun = 0; run(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') run(); });
window.addEventListener('pageshow', e => { if (e.persisted) run(); });
setInterval(() => { if (document.visibilityState === 'visible') run(); }, 15 * 60e3);
if (!demo && load()) render(load(), { stale: true }); // shown faded while the fresh check runs
run();
</script>
</body>
</html>
