name: FAA probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch FAA airport events
        run: |
          curl -sS -m 30 -A "MomTripWeather/1.0 (personal trip checker)" -w "\nHTTP %{http_code}\n" https://nasstatus.faa.gov/api/airport-events -o events.json || true
          head -c 300 events.json; echo
          python3 -c "import json;d=json.load(open('events.json'));print('airports:',len(d));print([a for a in d if a['airportId'] in ('MCO','DTW')])"
